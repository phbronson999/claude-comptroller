[package]
name = "claude-comptroller-connect"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "connect_core"
path = "src/lib.rs"

[dependencies]
arboard = "3.7.0"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation"] }
winreg = "0.56.0"

[features]
# Serves the UI from inside the exe, as the Tauri CLI does for a release. build.ps1 turns it on.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
resvg = "0.50.0"
