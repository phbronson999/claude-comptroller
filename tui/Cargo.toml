[package]
name = "claude-comptroller"
description = "Admin terminal for claude-comptroller: install, watch and configure the service."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
getrandom = "0.4.3"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
ratatui = "0.29"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.2"
# Windows' own TLS (SChannel), so checks trust the same certificates Windows does, a company CA included.
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_Globalization"] }
windows-service = "0.8.1"
winreg = "0.56.0"

[dev-dependencies]
# Turns the README pictures from SVG into PNG (src/screenshots.rs).
resvg = "0.50.0"

[lib]
name = "comptroller_admin"
path = "src/lib.rs"

[[bin]]
name = "claude-comptroller"
path = "src/main.rs"
