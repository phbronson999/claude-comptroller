[package]
name = "claude-comptroller"
description = "Admin terminal for claude-comptroller: install, watch and configure the service."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
getrandom = "0.4.3"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
ratatui = "0.29"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }
windows-service = "0.8.1"
winreg = "0.56.0"

[lib]
name = "comptroller_admin"
path = "src/lib.rs"

[[bin]]
name = "claude-comptroller"
path = "src/main.rs"
