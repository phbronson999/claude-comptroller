name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test service/Comptroller.slnx
      # The tray app's tests drive the service built by the step above.
      - run: cargo test --manifest-path connect/Cargo.toml
